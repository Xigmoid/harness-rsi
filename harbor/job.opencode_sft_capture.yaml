# CAPTURE variant of job.opencode_sft.yaml: the model endpoint points at the
# recording proxy, so every rollout's exact request (system prompt, tool
# schemas, message list) is written to the proxy's JSONL file.
#
# Harbor job for re-annotating the OpenThoughts-Agent-SFT-31.6K tasks with
# **opencode** as the rollout harness (the original was annotated with
# terminus-2).
#
# Run it with:
#
#   cd /Users/djx/Documents/CodesProject/harness-rsi
#   PYTHONPATH=. harbor job start -c harbor/job.opencode_sft.yaml \
#       -o /private/tmp/rsi-harbor/opencode-sft --yes
#
# ``PYTHONPATH=.`` is required: the job names the agent class by import path
# (``rsi.opencode_agent:RsiOpenCode``), so the host process has to be able to
# import the ``rsi`` package.
#
# The model endpoint is pinned in the agent's ``opencode_config`` block, so the
# job file is self-contained -- no ``OPENAI_*`` environment variable is needed.
# If you prefer the environment, export ``OPENAI_BASE_URL`` /
# ``OPENAI_API_KEY`` instead: Harbor's opencode adapter resolves the provider
# connection from them and writes the base URL into the provider block itself.
#
# ``jobs_dir`` lives under ``/private/tmp`` on purpose: Harbor bind-mounts each
# trial's log directory into the task container, and on macOS the project
# directory (and ``/tmp``, which is a symlink into ``/private``) cannot be
# mounted.  See ``rsi/paths.py``.

jobs_dir: /private/tmp/rsi-harbor/opencode-sft
n_attempts: 1
# 4 concurrent trials: each trial is its own container, and the containers
# share one image (see the README for why image and sandbox are different
# granularities).
n_concurrent_trials: 4
timeout_multiplier: 1.0

environment:
  type: docker
  delete: true
  # The image tag is content-addressed, so an unchanged task reuses the cached
  # image instead of rebuilding it.
  force_build: false

# The pilot does not score anything: it checks that the harness runs the
# agent, calls the model and writes the trajectory out.  The upstream
# datagen job disables the verifier for the same reason.
verifier:
  disable: true

retry:
  max_retries: 3
  include_exceptions:
  - ApiRateLimitError
  - ApiInternalServerError
  - ApiOverloadedError
  - ApiConnectionClosedError

agents:
- import_path: rsi.opencode_agent:RsiOpenCode
  # The agent name must **not** be one of Harbor's built-in agent names.
  # ``name: opencode`` makes Harbor ignore ``import_path`` and instantiate its
  # own built-in OpenCode agent, whose option schema has no
  # ``export_session`` / ``skip_install_if_present`` -- and the job then
  # fails with "Invalid kwargs for agent 'opencode': Unknown option
  # 'export_session'".  A custom name (the same trick the mini-swe-agent job
  # uses with ``rsi-mini-swe-agent``) keeps the import path in play and
  # validates the kwargs against RsiOpenCode's own options model.
  name: rsi-opencode
  # The provider id is a **custom** one, not ``openai``.  opencode's built-in
  # ``openai`` provider ships its own model registry and rejects a custom
  # model id with ``ProviderModelNotFoundError: Model not found:
  # openai/glm5.3-flash`` -- even when the model is declared under
  # ``provider.openai.models``.  A custom provider built on
  # ``@ai-sdk/openai-compatible`` accepts it, which is also what this
  # project's own ~/.config/opencode/opencode.json does.
  model_name: rsi_glm/glm5.3-flash
  # 1800 is what the upstream datagen job uses.  900 is not enough for
  # the IssueTasks environment: /app starts empty, so the agent has to
  # build the module from scratch, and a pilot run measured 73 steps and
  # 3.7M input tokens before it ran out of time -- it was still making
  # progress (it had installed astropy, read its source and was writing
  # the fix), not looping.
  override_timeout_sec: 1800
  override_setup_timeout_sec: 600
  kwargs:
    # The opencode build installed in the container.  Pinning it is not
    # optional: ``@latest`` moves under the harness and makes a batch
    # irreproducible.
    version: "1.18.33"
    # Write opencode's raw session (every part, tool input/output, session id)
    # next to the ATIF trajectory.
    export_session: true
    # Skip the per-trial npm install when the image already ships opencode.
    skip_install_if_present: true
    opencode_config:
      provider:
        rsi_glm:
          npm: "@ai-sdk/openai-compatible"
          name: "RSI GLM endpoint"
          options:
            baseURL: "http://host.docker.internal:8899/v1"
            apiKey: "EMPTY"
            setCacheKey: true
          models:
            glm5.3-flash:
              name: "glm5.3-flash"

datasets:
# The Harbor task registry for the four task families (SWE-Smith,
# StackExchange-SuperUser, StackExchange-Tezos, IssueTasks).
#
# The pilot runs one task per family.  ``opencode_sft/build_pilot_tasks.py``
# generates these directories from the extracted instructions, so the
# instruction the agent sees is byte-identical to the published one.
- path: /Users/djx/Documents/CodesProject/harness-rsi/opencode_sft/pilot/registry/swesmith
  task_names:
  - swesmith-00000_copy0001
- path: /Users/djx/Documents/CodesProject/harness-rsi/opencode_sft/pilot/registry/issue
  task_names:
  - issue-000000_copy0001
- path: /Users/djx/Documents/CodesProject/harness-rsi/opencode_sft/pilot/registry/tezos
  task_names:
  - tezos-0000
- path: /Users/djx/Documents/CodesProject/harness-rsi/opencode_sft/pilot/registry/superuser
  task_names:
  - superuser-000000_copy0000
