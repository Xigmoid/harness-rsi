# Harbor job for the **full** OpenThoughts-Agent re-annotation with opencode.
#
# This is the production job.  The pilot job (``job.opencode_sft.yaml``) and
# the pilot's capture variant (``job.opencode_sft_capture.yaml``) run four
# tasks; this one runs all 31,600.
#
# Run it with::
#
#   cd /Users/djx/Documents/CodesProject/harness-rsi
#   PYTHONPATH=. harbor job start -c harbor/job.opencode_sft_full.yaml \
#       -o runs/opencode-sft-full --yes
#
# ``PYTHONPATH=.`` is required: the job names the agent class by import path
# (``rsi.opencode_agent:RsiOpenCode``), so the host process has to be able to
# import the ``rsi`` package.
#
# The registry is generated by ``opencode_sft/build_registry.py``.  Every task
# in it names a **family-shared base image** in its ``task.toml``::

#     [environment]
#     docker_image = "rsi/oc-base-swesmith:1"
#
# which is what makes the scale affordable: four images in total instead of
# one build per task.  The per-task half of the environment -- for SWE-Smith
# the repository at the instance's bug-injected commit -- is prepared at run
# time by the task's own ``environment/setup.sh``, which the agent adapter
# runs in the container before opencode starts.
#
# ``jobs_dir`` lives under the repository rather than under ``/tmp``: Harbor
# bind-mounts each trial's log directory into the task container, and the
# trial directories are the *result* of an eight-day run -- they must not
# live somewhere a reboot wipes.  The mount works from the repository (the
# container can read and write it), which is why this differs from the
# pilot's ``/private/tmp`` choice.

jobs_dir: runs/opencode-sft-full
n_attempts: 1
# 16 concurrent trials.  Each trial is its own container, and the containers
# are the scarce resource here: Docker Desktop on this host is limited to
# 10 CPUs and 9.7 GB of memory, and a trial's container holds opencode, its
# node runtime and the agent's own working set.  Raise this when the host
# grows; lower it when the containers start to swap.
n_concurrent_trials: 16
timeout_multiplier: 1.0

environment:
  type: docker
  delete: true
  # The family image is pre-built and named in the task's own task.toml, so
  # there is nothing to build here.  Setting the flag to false keeps Harbor
  # from trying to build the (absent) environment/Dockerfile.
  force_build: false

# The re-annotation does not score anything: it records trajectories.  The
# upstream datagen job disables the verifier for the same reason.
verifier:
  disable: true

retry:
  max_retries: 3
  include_exceptions:
  - ApiRateLimitError
  - ApiInternalServerError
  - ApiOverloadedError
  - ApiConnectionClosedError

agents:
- import_path: rsi.opencode_agent:RsiOpenCode
  # The agent name must **not** be one of Harbor's built-in agent names.
  # ``name: opencode`` makes Harbor ignore ``import_path`` and instantiate its
  # own built-in OpenCode agent, whose option schema has no
  # ``export_session`` / ``skip_install_if_present``.
  name: rsi-opencode
  # The provider id is a **custom** one, not ``openai``.  opencode's built-in
  # ``openai`` provider ships its own model registry and rejects a custom
  # model id with ``ProviderModelNotFoundError``.
  model_name: rsi_glm/glm5.3-flash
  # 1800 is what the upstream datagen job uses.  900 is not enough for the
  # IssueTasks environment: /app starts empty, so the agent has to build the
  # module from scratch, and a pilot run measured 73 steps and 3.7M input
  # tokens before it ran out of time -- it was still making progress, not
  # looping.
  override_timeout_sec: 1800
  # The setup phase carries the per-task environment preparation: the
  # SWE-Smith repository checkout (up to a minute from GitHub for the
  # largest repositories) and the editable install (a minute or two for a
  # repository with compiled extensions).  1800 gives it room; a setup that
  # exceeds it fails the trial, which is the right outcome -- a half-prepared
  # environment is not a rollout.
  override_setup_timeout_sec: 1800
  kwargs:
    # The opencode build installed in the container.  Pinning it is not
    # optional: ``@latest`` moves under the harness and makes a batch
    # irreproducible.
    version: "1.18.33"
    # Write opencode's raw session (every part, tool input/output, session id)
    # next to the ATIF trajectory.
    export_session: true
    # Skip the per-trial npm install when the image already ships opencode.
    skip_install_if_present: true
    opencode_config:
      provider:
        rsi_glm:
          npm: "@ai-sdk/openai-compatible"
          name: "RSI GLM endpoint"
          options:
            # The recording proxy: it forwards to the real endpoint and
            # writes down what the model was actually sent, which is the
            # only source of opencode's system prompt and tool schemas.
            baseURL: "http://host.docker.internal:8899/v1"
            apiKey: "EMPTY"
            setCacheKey: true
          models:
            glm5.3-flash:
              name: "glm5.3-flash"

datasets:
# The Harbor task registry, one directory per family.  Every directory holds
# one task per dataset row: the first row of a task keeps the task's own
# name, the further rows of the same task carry the row index, because the
# published dataset rolled 1,432 tasks out more than once and 766 of those
# repeats used a different instruction.
- path: /Users/djx/Documents/CodesProject/harness-rsi/opencode_sft/registry/swesmith
- path: /Users/djx/Documents/CodesProject/harness-rsi/opencode_sft/registry/issue
- path: /Users/djx/Documents/CodesProject/harness-rsi/opencode_sft/registry/tezos
- path: /Users/djx/Documents/CodesProject/harness-rsi/opencode_sft/registry/superuser
