jobs_dir: runs/harbor
n_attempts: 1
n_concurrent_trials: 16
timeout_multiplier: 1.0
environment:
  type: docker
  delete: true
  force_build: false
retry:
  max_retries: 3
  include_exceptions:
  - ApiRateLimitError
  - ApiInternalServerError
  - ApiOverloadedError
  - ApiConnectionClosedError
agents:
- import_path: rsi.harbor_agent:RsiMiniSweAgent
  name: rsi-mini-swe-agent
  model_name: openai/glm5.3-flash
  kwargs:
    version: 2.4.6
    config:
      agent:
        agent_class: rsi.rhi_agent.RhiAgent
