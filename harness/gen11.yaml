agents:
- contract:
    format: json
    free_text: true
    in_fields:
    - task
    - findings
    - evidence
    - patch
    - test_results
    - status
    max_tokens: 800
    out_fields:
    - plan
    - summary
    - status
  id: orchestrator
  instruction_slots:
    forbidden_outputs:
    - raw_logs
    goal: primary
    required_outputs:
    - summary
    verification: self_check
  instruction_template: standard
  max_tokens: 8192
  model: openai/glm5.3-flash
  reasoning_effort: high
  role: planner
  tools:
  - read_file
  - grep_file
  - run_bash
- contract:
    format: json
    free_text: true
    in_fields:
    - task
    - plan
    max_tokens: 800
    out_fields:
    - findings
    - evidence
  id: investigator
  instruction_slots:
    forbidden_outputs:
    - patch
    goal: thorough
    required_outputs:
    - findings
    - evidence
    verification: self_check
  instruction_template: standard
  max_tokens: 8192
  model: openai/glm5.3-flash
  reasoning_effort: high
  role: coordinator
  tools:
  - read_file
  - grep_file
  - run_bash
- contract:
    format: json
    free_text: true
    in_fields:
    - task
    - findings
    - evidence
    max_tokens: 800
    out_fields:
    - patch
    - test_results
  id: implementer
  instruction_slots:
    forbidden_outputs:
    - questions
    goal: primary
    required_outputs:
    - patch
    - test_results
    verification: self_check
  instruction_template: standard
  max_tokens: 8192
  model: openai/glm5.3-flash
  reasoning_effort: high
  role: implementer
  tools:
  - read_file
  - grep_file
  - run_bash
auxiliary_rules:
  acceptance_gates:
  - the change is applied in the workspace
  - the relevant tests pass
  communication_rules:
  - every handoff must be self-contained
  failure_fallback:
  - retry_once
  - degrade_to_free_text
  recall_triggers:
  - the findings do not point at a concrete file
meta:
  changed_fields:
  - agents[1].role
  objective: if_only
  optimizer: bandit_ucb
  parent: 10
  rationale: UCB chose agents[1].role (value=inf, trials=0)
runtime:
  context_keep_recent: 20
  hop_context_max_chars: 6000
  max_hops: 6
  max_iterations: 40
  min_delegations: 1
  observation_max_chars: 10000
  seed: 1234
  temperature: 0.0
version: 0
workflow:
- id: h1
  pass_fields:
  - task
  - plan
  source: orchestrator
  target: investigator
- id: h2
  pass_fields:
  - task
  - findings
  source: orchestrator
  target: implementer
- id: h3
  pass_fields:
  - findings
  - evidence
  source: investigator
  target: orchestrator
- id: h4
  pass_fields:
  - patch
  - test_results
  source: implementer
  target: orchestrator
