[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsi"
version = "0.1.0"
description = "Harbor adapters for the mini-swe-agent and opencode harnesses used by the SFT annotation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "harness-rsi" }]
keywords = ["agent", "harness", "sft", "mini-swe-agent", "opencode", "harbor"]

# The package holds two Harbor adapters and nothing else:
#
#   rsi.harbor_agent   -- the mini-swe-agent adapter
#   rsi.opencode_agent -- the opencode adapter
#   rsi.paths          -- the paths the host and the container agree on
#
# The adapters subclass Harbor's own agents, so Harbor is the real dependency.
# It needs Python >= 3.12 and therefore lives in the *driver* environment
# (``.venv312``); the helper environment (``.venv``) installs the package
# without it.
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
harbor = ["harbor==0.24.0"]

[tool.setuptools.packages.find]
include = ["rsi*"]
