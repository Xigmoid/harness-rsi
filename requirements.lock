# The helper environment (``.venv``): everything the registry builders, the
# task extractors and the converters need, and nothing else.
#
#   PyYAML          -- the task registries, the job files, the mini config
#   pyarrow         -- reading ``train.parquet`` (the OpenThoughts rollouts)
#   huggingface_hub -- downloading the two public datasets
#
# The versions are the ones the pipeline was developed and audited against.
# The *driver* environment (``.venv312``) is a separate lock: it carries
# Harbor 0.24.0, which needs Python >= 3.12.
